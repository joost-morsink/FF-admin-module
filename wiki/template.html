<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
      
            .leftside {
                width: 100%;
                min-width: 200px;
                display: block;
                padding: 3px;
                margin: 3px;
            }
            .main-container {
                width: 100%;
                min-width: 300px;
                max-width: 1000px;
                display: block;
                padding: 3px;
                margin: 3px;
            }
        
            @media only screen and (min-width: 1000px) {
                .topbar {
                    position:fixed;
                }
                .leftside {
                    position: fixed;
                    max-width: 300px;
                    min-width: 300px;
                    display: inline-block;
                    padding: 3px;
                    vertical-align: text-top;
                    margin: 3px;
                    margin-top: 150px;
                }
                .main-container {
                    position:absolute;
                    top: 150px;
                    left: 300px;
                    right:0;
                    bottom:0;
                    width: 70%;
                    min-width: 300px;
                    max-width: 1200px;
                    display: inline-block;
                    padding: 3px;
                    vertical-align: text-top;
                    margin: 3px;
                    overflow-y: auto;
                }
            }

            .main {
                display: flex;
            }
            .topbar {
                width:100%;
                margin: 3px;
                background-color: white;
                opacity: 100%;
            }
            .topbar > img {
                width:100%;
                max-width: 800px;
            }

            .column-container {
                display: flex;
            }
            .column {
                flex: 1;
                padding: 3px;
                border-left: solid lightgrey 1px;
                border-collapse: collapse;
            }
            body {
                font-family: Arial, Helvetica, sans-serif;
            }
            table,td,th {
                border: solid black 1px;
                border-collapse: collapse;
            }
            td {
                padding: 5px;
            }
            th { 
                text-align: left;
                padding: 5px;
            }
            svg {
                max-width: 100% ;
                height: auto;
                border: solid lightgrey 1px;

            }
            a.imagelink {
                color: grey;
                margin-left: -80px;
                margin-top:-20px;
                text-decoration: none;
            }
            a.imagelink::before{
                content: "Download"
            }
            a.imagelink:hover {
                color:lightgrey;
                
            }
        </style>
        <title>${title}</title>
    </head>
    <body>
        <div class="topbar">
            <img src="$branch$/images/Logo.svg"/>
        </div>
        <div class="leftside">
            <a href="$branch$/index">Main page</a><br/>
            Recently visited pages:
            $recent$
        </div>
        <div class="main-container">
            <div class="main">
                <div>
                    $body$
                    <br/><i>By ${author}</i><br/>

                </div>

            </div>
        </div>
    </body>
</html>
