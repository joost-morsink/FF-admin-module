<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #fff;
                font-family: "Montserrat", sans-serif;
                font-optical-sizing: auto;
                font-weight: 300;
                font-style: normal;
            }
            h1, h2, h3 {
                font-family: "Quicksand", sans-serif;
                font-weight: 700;
            }
            h1 {
                font-size: 2em;
                color: #0D79C2;
            }
            h2 {
                font-size: 1.5em;
                color: #0996DA;
            }
            h3 {
                font-size: 1.25em;
                color: #0D79C2;
            }
            div.leftside {
                display: none;
            }
            .leftside {
                width: 100%;
                min-width: 200px;
                display: block;
                padding: 3px;
                margin: 3px;
            }
            .main-container {
                width: 100%;
                min-width: 300px;
                max-width: 1000px;
                display: block;
                padding: 3px;
                margin: 3px;
            }
        
            @media only screen and (min-width: 1000px) {
                .topbar {
                    position:fixed;
                }
                div.leftside {
                    display: block;
                }
                .leftside {
                    position: fixed;
                    max-width: 300px;
                    min-width: 300px;
                    display: inline-block;
                    padding: 3px;
                    vertical-align: text-top;
                    margin: 3px;
                    margin-top: 150px;
                }
                .main-container {
                    position:absolute;
                    top: 150px;
                    left: 300px;
                    right:0;
                    bottom:0;
                    width: 70%;
                    min-width: 300px;
                    max-width: 1200px;
                    display: inline-block;
                    padding: 3px;
                    vertical-align: text-top;
                    margin: 3px;
                    overflow-y: auto;
                }
            }

            .main {
                display: flex;
            }
            .topbar {
                width:100%;
                padding: 3px;
                opacity: 100%;
            }
            .topbar > img {
                width:100%;
                max-width: 800px;
            }

            div.footer {
                margin-top: 10;
            }
            .footer > img {
                background-color: #0D79C2;
                height: 1em;
            }
            .column-container {
                display: flex;
            }
            .column {
                flex: 1;
                padding: 3px;
                border-left: solid lightgrey 1px;
                border-collapse: collapse;
            }
            table,td,th {
                border: solid black 1px;
                border-collapse: collapse;
            }
            td {
                padding: 5px;
            }
            th { 
                text-align: left;
                padding: 5px;
            }
            svg {
                max-width: 100% ;
                height: auto;
                border: solid lightgrey 1px;

            }
            a.imagelink {
                color: grey;
                margin-left: -80px;
                margin-top:-20px;
                text-decoration: none;
            }
            a.imagelink::before{
                content: "Download"
            }
            a.imagelink:hover {
                color:lightgrey;
                
            }
            @media print
            {    
                .no-print, .no-print *
                {
                    display: none !important;
                }
            }
        </style>
        <title>${title}</title>
    </head>
    <body>
        <div class="topbar">
            <img src="$branch$/images/Logo.svg"/>
        </div>
        <div class="leftside no-print">
            <a href="$branch$/index">Main page</a><br/>
            Recently visited pages:
            $recent$
        </div>
        <div class="main-container">
            <div class="main">
                <div>
                    $body$
                    <br/><i>By ${author}</i><br/>
                </div>
            </div>
            <div class="footer">
                 &copy; 2025 <img src="$branch$/images/Logo2.svg" />
            </div>
        </div>
    </body>
</html>
