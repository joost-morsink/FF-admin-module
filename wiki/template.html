<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #fff;
                font-family: "Montserrat", sans-serif;
                font-optical-sizing: auto;
                font-weight: 300;
                font-style: normal;
            }
            h1, h2, h3 {
                font-family: "Quicksand", sans-serif;
                font-weight: 700;
            }
            h1 {
                font-size: 2em;
                color: #0D79C2;
            }
            h2 {
                font-size: 1.5em;
                color: #0996DA;
            }
            h3 {
                font-size: 1.25em;
                color: #0D79C2;
            }
            div.leftside {
                display: none;
            }
            .leftside {
                width: 100%;
                min-width: 200px;
                display: block;
                padding: 3px;
                margin: 3px;
            }
            .main-container {
                width: 100%;
                min-width: 300px;
                max-width: 1000px;
                display: block;
                padding: 3px;
                margin: 3px;
            }
        
            @media only screen and (min-width: 1000px) {
                .topbar {
                    position:fixed;
                }
                div.leftside {
                    display: block;
                }
                .leftside {
                    position: fixed;
                    max-width: 300px;
                    min-width: 300px;
                    display: inline-block;
                    padding: 3px;
                    vertical-align: text-top;
                    margin: 3px;
                    margin-top: 150px;
                }
                .main-container {
                    position:absolute;
                    top: 150px;
                    left: 300px;
                    right:0;
                    bottom:0;
                    width: 70%;
                    min-width: 300px;
                    max-width: 1200px;
                    display: inline-block;
                    padding: 3px;
                    vertical-align: text-top;
                    margin: 3px;
                    overflow-y: auto;
                }
            }

            .main {
                display: flex;
            }
            .topbar {
                width:100%;
                padding: 3px;
                opacity: 100%;
            }
            .topbar > img {
                width:100%;
                max-width: 800px;
            }

            div.footer {
                margin-top: 10;
            }
            .footer > img {
                background-color: #0D79C2;
                height: 1em;
            }
            .column-container {
                display: flex;
            }
            .column {
                flex: 1;
                padding: 3px;
                border-left: solid lightgrey 1px;
                border-collapse: collapse;
            }
            table,td,th {
                border: solid black 1px;
                border-collapse: collapse;
            }
            td {
                padding: 5px;
            }
            th { 
                text-align: left;
                padding: 5px;
            }
            svg {
                max-width: 100% ;
                height: auto;
                border: solid lightgrey 1px;

            }
            div.diagram {
                position: relative; /* establish a positioning context */
                display: inline-block; /* shrink to fit */
            }
            div.diagram > svg {
              display: block; /* remove unwanted spacing */
            }

            div.diagram > a.imagelink {
                position: absolute;
                bottom: 10px; /* distance from bottom */
                right: 10px;  /* distance from right */
                opacity: 0;
                background: #0D79C2;
                color:lightgrey;
                padding: 5px 10px;
                text-decoration: none;
                border-radius: 4px;
                transition: opacity 0.5s ease-in-out;
            }
            div.diagram >a.imagelink::before{
                content: "Download"
            }
            div.diagram > a.imagelink:hover {
                opacity: 1;
            }
            @media print
            {    
                .no-print, .no-print *, .a.imagelink 
                {
                    display: none !important;
                }
            }
        </style>
        <title>Give for good - ${title}</title>
    </head>
    <body>
        <script>
function trackVisit(title, url) {
    if(title[0] == '$') {// title not set
        return;
    }
    const key = 'recentlyViewed_$branch$';
    const maxItems = 10;

    const current = JSON.parse(localStorage.getItem(key)) || [];

    // Remove if already exists
    const filtered = current.filter(item => item.url !== url);

    // Add to beginning
    filtered.unshift({ title, url });

    // Limit the list
    const limited = filtered.slice(0, maxItems);

    localStorage.setItem(key, JSON.stringify(limited));
}

function showRecent(){
    const key = 'recentlyViewed_$branch$';
    var list = document.getElementById("recent");

    const items = JSON.parse(localStorage.getItem(key)) || [];
    console.log(items);
    // Clear the list
    list.innerHTML = '<ul/>';

    // Add each item as an <li><a></a></li>
    for (const item of items) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = item.url;
        a.textContent = item.title;
        li.appendChild(a);
        list.appendChild(li);
    }
}
window.onload = () => {
    showRecent();
    trackVisit(document.title.substring("Give for Good - ".length), window.location.href);
};

        </script>
        <div class="topbar">
            <img src="$branch$/images/Logo.svg"/>
        </div>
        <div class="leftside no-print">
            <a href="$branch$/index">Main page</a><br/>
            Recently visited pages:
            <div id="recent">

            </div>
        </div>
        <div class="main-container">
            <div class="main">
                <div>
                    $body$
                    <br/><i>By ${author}</i><br/>
                </div>
            </div>
            <div class="footer">
                 &copy; 2025 <img src="$branch$/images/Logo2.svg" />
            </div>
        </div>
    </body>
</html>
